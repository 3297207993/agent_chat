# The adapter track: crates/tauri-plugin-cambia on three platforms. Slow by nature — the Tauri
# dependency tree is large — which is exactly why it is not part of the core track
# (implementation.md 3.6). It can be narrowed to a nightly or pre-release trigger without changing
# what it proves; until then it runs on the same path filter.
#
# It lives at the repository root because that is the only place GitHub reads; see the note in
# cambia-core.yml about the move when cambia becomes its own repository.
name: cambia / adapter

on:
  push:
    paths:
      - 'cambia/crates/tauri-plugin-cambia/**'
      - '.github/workflows/cambia-adapter.yml'
  pull_request:
    paths:
      - 'cambia/crates/tauri-plugin-cambia/**'
      - '.github/workflows/cambia-adapter.yml'
  workflow_dispatch:

jobs:
  platform:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # The three desktop platforms Cambia claims support for on (kernel.md 5.3.2 marks the mobile
        # ones as unsupported).
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    defaults:
      run:
        working-directory: cambia/crates/tauri-plugin-cambia
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: cambia/crates/tauri-plugin-cambia -> target

      # The adapter is its own workspace (its Cargo.toml carries a [workspace] table), so it is not
      # covered by the core track's cargo invocations.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # The guest-js package the host imports (`@cambia/plugin-cambia`); it has its own lockfile.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: cambia/crates/tauri-plugin-cambia/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
