[package]
name = "tauri-plugin-cambia"
version = "0.1.0"
description = "Tauri adapter for Cambia: turns Tauri's protocols and paths into the ports the Cambia host declares"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-only"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-cambia"

# Its own workspace on purpose. The Cambia workspace excludes this crate, so Tauri's three-platform
# build can never leak into the kernel's fast track — that exclusion is what makes "the kernel
# implementation layer has zero Tauri dependencies" structural rather than aspirational
# (implementation.md 3.6, CONTRIBUTING hard rule 3).
#
# `examples/tauri-app` is excluded in turn: it is a standalone application with its own lockfile, and
# without this line cargo refuses to build it at all ("current package believes it's in a workspace
# when it's not").
[workspace]
exclude = ["examples/tauri-app/src-tauri"]

[dependencies]
# `protocol-asset` is what makes `Manager::asset_protocol_scope()` exist at all, so this crate needs it
# to compile. **The host application needs it too** — `tauri-build` compares the app's `tauri.conf.json`
# (`app.security.assetProtocol.enable`) against the app's own dependency features and refuses to build
# when they disagree, so enabling it here is not enough (measured on the example app). If K2.4
# concludes that `asset:` does not hold and a custom scheme takes over, this feature goes with it.
tauri = { version = "2.11.3", features = ["protocol-asset"] }
serde = "1.0"
serde_json = "1.0"
thiserror = "2"
# sync: the answer slot for a backend's own call. time: the timeout on that answer.
tokio = { version = "1", features = ["sync", "time"] }
# The kernel implementation layer. The dependency is one-way on purpose: `plugin-host` must never
# grow a Tauri dependency, which is what keeps "delete the adapter and the kernel still holds"
# true (kernel.md 5.1, CONTRIBUTING hard rule 3).
cambia-plugin-host = { path = "../plugin-host" }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
