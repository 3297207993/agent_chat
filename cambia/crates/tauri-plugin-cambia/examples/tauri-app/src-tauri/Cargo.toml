[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.3", default-features = false }

[dependencies]
# `protocol-asset` must be enabled **by the application**, not only by this plugin crate: `tauri-build`
# compares the app's `tauri.conf.json` (`app.security.assetProtocol.enable`) against the app's own
# dependency features and refuses to build when they disagree. Measured on the example app — the
# adapter enabling the feature is not enough, because that check reads the app's manifest.
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-cambia = { path = "../../../" }

