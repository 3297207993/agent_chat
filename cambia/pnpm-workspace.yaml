# Workspace root of the kernel and the ecosystem packages.
# The adapter layer (crates/tauri-plugin-cambia) is deliberately not listed here: it ships its own
# package.json and lockfile, and lives in an independent workspace on its own CI track
# (implementation.md 3.3(g)).
packages:
  - packages/*
  - examples/*

# pnpm blocks dependency build scripts by default; esbuild needs its postinstall to install the
# platform binary
allowBuilds:
  esbuild: true
